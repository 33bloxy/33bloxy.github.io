      width: 72px;

      flex-shrink: 0;

      background: var(--accent);
      color: var(--accent-fg);
    }

    h1 {
      margin: 0;
      max-width: 100%;

      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(36px, 12vw, 52px);
      letter-spacing: -0.045em;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;

      width: 100%;
      min-width: 0;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 12px;

      width: 100%;
      min-width: 0;
      padding: 14px 12px;

      border: 1px solid transparent;
      border-radius: 18px;

      background: var(--row);
      color: var(--fg);
      text-decoration: none;

      transition: background 0.15s ease, transform 0.15s ease;
    }

    .link:hover {
      background: var(--row-hover);
      transform: translateY(-1px);
    }

    .link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .ico {
      display: grid;
      place-items: center;
      flex: 0 0 44px;

      width: 44px;
      height: 44px;

      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--accent);
    }

    .ico svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    .txt {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      gap: 3px;

      overflow-wrap: anywhere;
    }

    .name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .go {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .link:hover .go {
      color: var(--accent);
    }

    @media (max-width: 360px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card {
        padding: 24px 16px 18px;
        border-radius: 24px;
      }

      .link {
        gap: 9px;
        padding: 12px 10px;
      }

      .name {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }

      .link:hover {
        transform: none;
      }
    }
  </style>
</head>
